<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Your information is kept private and secure</title>
  <desc id="d">A shield with a padlock, surrounded by a document and a phone, representing data privacy.</desc>
  <rect width="800" height="360" fill="#f4f1ec"/>
  <circle cx="400" cy="180" r="140" fill="#e8e2d8"/>
  <!-- document -->
  <g transform="translate(140 95)">
    <rect width="120" height="150" rx="8" fill="#fff" stroke="#2b2f33" stroke-width="3"/>
    <rect x="18" y="24" width="84" height="8" rx="4" fill="#b9b1a3"/>
    <rect x="18" y="48" width="84" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="18" y="72" width="60" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="18" y="96" width="84" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="18" y="120" width="44" height="8" rx="4" fill="#d6cfc2"/>
  </g>
  <!-- phone -->
  <g transform="translate(545 85)">
