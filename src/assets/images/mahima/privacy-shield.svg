    <rect x="38" y="10" width="24" height="5" rx="2.5" fill="#b9b1a3"/>
    <rect x="14" y="36" width="72" height="26" rx="8" fill="#d6cfc2"/>
    <rect x="14" y="72" width="54" height="26" rx="8" fill="#e8e2d8"/>
    <rect x="14" y="108" width="72" height="26" rx="8" fill="#d6cfc2"/>
  </g>
  <!-- shield -->
  <path d="M400 62 L478 90 V176 C478 226 444 262 400 282 C356 262 322 226 322 176 V90 Z" fill="#2b2f33"/>
  <path d="M400 76 L466 99 V176 C466 218 438 250 400 268 C362 250 334 218 334 176 V99 Z" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  <!-- padlock -->
  <path d="M376 160 V148 a24 24 0 0 1 48 0 V160" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <rect x="362" y="158" width="76" height="58" rx="10" fill="#fff"/>
  <circle cx="400" cy="183" r="8" fill="#2b2f33"/>
  <rect x="396" y="187" width="8" height="16" rx="3" fill="#2b2f33"/>
