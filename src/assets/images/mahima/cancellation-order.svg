<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cancelling or changing an order</title>
  <desc id="d">A calendar, a phone and a cancelled order tag, representing how to cancel or change a sofa order.</desc>
  <rect width="800" height="360" fill="#f4f1ec"/>
  <circle cx="400" cy="180" r="140" fill="#e8e2d8"/>
  <!-- calendar -->
  <g transform="translate(150 80)">
    <rect width="190" height="190" rx="14" fill="#fff" stroke="#2b2f33" stroke-width="3"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 H176 a14 14 0 0 1 14 14 V52 H0 Z" fill="#2b2f33"/>
    <rect x="42" y="-12" width="12" height="30" rx="6" fill="#b9b1a3" stroke="#2b2f33" stroke-width="3"/>
    <rect x="136" y="-12" width="12" height="30" rx="6" fill="#b9b1a3" stroke="#2b2f33" stroke-width="3"/>
    <g fill="#d6cfc2">
      <rect x="22" y="72" width="28" height="22" rx="5"/><rect x="62" y="72" width="28" height="22" rx="5"/>
      <rect x="102" y="72" width="28" height="22" rx="5"/><rect x="142" y="72" width="28" height="22" rx="5"/>
      <rect x="22" y="106" width="28" height="22" rx="5"/><rect x="62" y="106" width="28" height="22" rx="5"/>
      <rect x="142" y="106" width="28" height="22" rx="5"/>
      <rect x="22" y="140" width="28" height="22" rx="5"/><rect x="102" y="140" width="28" height="22" rx="5"/>
    </g>
    <rect x="102" y="106" width="28" height="22" rx="5" fill="#2b2f33"/>
  </g>
  <!-- cancelled order tag -->
  <g transform="translate(400 120) rotate(-6)">
    <rect width="230" height="120" rx="14" fill="#fff" stroke="#2b2f33" stroke-width="3"/>
    <rect x="24" y="26" width="110" height="10" rx="5" fill="#2b2f33"/>
    <rect x="24" y="52" width="150" height="8" rx="4" fill="#d6cfc2"/>
    <rect x="24" y="72" width="100" height="8" rx="4" fill="#d6cfc2"/>
    <circle cx="188" cy="86" r="26" fill="#2b2f33"/>
    <g stroke="#fff" stroke-width="7" stroke-linecap="round"><path d="M177 75 L199 97 M199 75 L177 97"/></g>
  </g>
  <!-- phone -->
  <g transform="translate(590 205)">
    <rect width="88" height="120" rx="16" fill="#fff" stroke="#2b2f33" stroke-width="3"/>
    <rect x="30" y="10" width="28" height="5" rx="2.5" fill="#b9b1a3"/>
    <path d="M30 56 q0 -8 8 -8 h6 l5 12 l-7 5 q5 10 14 14 l5 -7 l12 5 v6 q0 8 -8 8 q-35 -3 -35 -35 Z" fill="#2b2f33" transform="translate(-4 8) scale(.95)"/>
  </g>
</svg>
