<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Photos and colours may differ slightly from the finished sofa</title>
  <desc id="d">A sofa with fabric colour swatches and an information notice, showing that real colours and finish can vary from photos.</desc>
  <rect width="800" height="360" fill="#f4f1ec"/>
  <circle cx="400" cy="180" r="140" fill="#e8e2d8"/>
  <!-- sofa -->
  <g transform="translate(215 150)" stroke="#2b2f33" stroke-width="3" stroke-linejoin="round">
    <rect x="30" y="0" width="290" height="80" rx="24" fill="#fff"/>
    <rect x="0" y="58" width="350" height="70" rx="20" fill="#d6cfc2"/>
    <rect x="-14" y="44" width="46" height="100" rx="18" fill="#c9c0b0"/>
    <rect x="318" y="44" width="46" height="100" rx="18" fill="#c9c0b0"/>
    <line x1="175" y1="6" x2="175" y2="60" stroke-width="2" stroke-opacity=".5"/>
    <line x1="60" y1="144" x2="60" y2="162"/>
    <line x1="290" y1="144" x2="290" y2="162"/>
  </g>
  <!-- swatches -->
  <g transform="translate(250 262)" stroke="#2b2f33" stroke-width="2.5">
    <rect x="0" y="0" width="48" height="36" rx="6" fill="#4f7f86"/>
    <rect x="62" y="0" width="48" height="36" rx="6" fill="#a8734f"/>
    <rect x="124" y="0" width="48" height="36" rx="6" fill="#8d9a6b"/>
    <rect x="186" y="0" width="48" height="36" rx="6" fill="#c98aa0"/>
    <rect x="248" y="0" width="48" height="36" rx="6" fill="#7b7f8c"/>
  </g>
  <!-- info badge -->
  <g transform="translate(590 90)">
    <circle r="46" fill="#2b2f33"/>
    <circle r="37" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
    <circle cy="-18" r="6" fill="#fff"/>
    <rect x="-6" y="-6" width="12" height="32" rx="5" fill="#fff"/>
  </g>
</svg>
